name: Sync with Upstream & Build Native Codicons

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git Configuration
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote & Sync
        run: |
          git remote add upstream https://github.com/microsoft/vscode-codicons.git
          git fetch upstream main
          # Merge upstream changes favoring our scripts if conflicts occur
          git merge upstream/main -m "chore(sync): merge upstream microsoft/vscode-codicons" || git merge --abort || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Assets & Generate Jetpack Compose Codicons
        run: |
          npm run build
          node ./scripts/export-to-compose.js

      - name: Commit and Push Changes
        id: commit_step
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new icon updates found."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "feat(icons): auto-sync latest codicons from upstream & generate Compose artifacts"
            git push origin main
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crest-codicons-artifacts
          path: |
            dist/Codicons.kt
            dist/codicon.ttf
            dist/codicon.css
            dist/codicon.svg
